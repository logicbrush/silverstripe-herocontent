---
name: herocontent
---

Page:
  extensions:
    - Logicbrush\HeroContent\Model\WithHeroContentExtension
    - Logicbrush\HeroContent\Model\WithAdditionalContentExtension
    - Logicbrush\HeroContent\Model\WithPageClassesExtension
    - Logicbrush\HeroContent\Model\WithPageNavigationExtension

PageController:
  extensions:
    - Logicbrush\HeroContent\Controllers\PageSearchExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverStripe\Versioned\Versioned
    - Logicbrush\HeroContent\Model\VersionedSiteConfigExtension
    - Logicbrush\HeroContent\Model\ContactInfoExtension
    - Logicbrush\HeroContent\Model\SiteLogoExtension
    - Logicbrush\HeroContent\Model\SocialProfilesExtension

SilverStripe\Core\Injector\Injector:
  SilverStripe\SiteConfig\SiteConfigLeftAndMain:
    class: Logicbrush\HeroContent\Admin\VersionedSiteConfigAdmin
