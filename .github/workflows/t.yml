name: "Annotate & Tidy"

on: 
  push:
    branches:
      - "feature/*"
      - "release/*"
      - "develop"

jobs:

  tidy:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: xdebug, intl
      - name: Configure CI advisory ignores
        run: |
          jq --slurpfile ids .github/composer-advisory-ignores.json \
          '.config.policy.advisories["ignore-id"] = $ids[0]' \
          composer.json > composer-ci.json
      - uses: php-actions/composer@v6
        env:
          COMPOSER: composer-ci.json
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /app
        with:
          command: update --with silverstripe/framework:^5.0
          php_version: 8.1
          php_extensions: xdebug intl
      - name: Apply Rector
        run: ./vendor/bin/rector process src tests
      - name: Generate Code Coverage
        run: |
          XDEBUG_MODE=coverage \
          ./vendor/bin/phpunit -c phpunit.xml.dist \
          --coverage-clover ./coverage.xml
      - name: Annotate with Metrics
        run: |
          find src -name "*.php" | xargs ./vendor/bin/metrics annotate ./coverage.xml
      - name: Tidy Source Code
        run: |
          find tests -name "*.php" | xargs ./vendor/bin/phptidy.php replace
          find src -name "*.php" | xargs ./vendor/bin/phptidy.php replace
      - name: Push Back Changes
        run: |
          git diff --exit-code src tests || ( \
            git config user.name github-actions && \
            git config user.email github-actions@github.com && \
            git add src && git add tests && \
            git commit -m "tidy" && \
            git push \
          )
