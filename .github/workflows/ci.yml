name: "Continuous Integration"

on: 
  push:

jobs:

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.1'
            phpunit-version: '9.5'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.2'
            phpunit-version: '9.5'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.3'
            phpunit-version: '9.5'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '6.0'
            php-version: '8.3'
            phpunit-version: '11.3'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '6.0'
            php-version: '8.4'
            phpunit-version: '11.3'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '6.0'
            php-version: '8.5'
            phpunit-version: '11.3'
  
    name: SS ${{ matrix.silverstripe-version }}, PHP ${{ matrix.php-version }}
    runs-on: ${{ matrix.operating-system }}
    steps:
      - uses: actions/checkout@v3
      - name: Configure CI advisory ignores
        run: |
          jq --argjson ids '[
            "PKSA-pjvm-vnw2-n3m2",
            "PKSA-ccyg-wwy5-yyd3",
            "PKSA-znsz-m7d7-h56t",
            "PKSA-56d7-q47d-h34q",
            "PKSA-vfdf-hjn1-7mdt",
            "PKSA-7mbq-dxf7-1z4d",
            "PKSA-mxm6-h6dq-vmtc",
            "PKSA-v91s-x13r-xsps",
            "PKSA-byd1-vwr7-j3ng",
            "PKSA-2w11-jnmw-7vn5",
            "PKSA-2h3f-jtk1-8f25",
            "PKSA-r36n-y55f-yj29",
            "PKSA-3ddc-hhgt-bqh9",
            "PKSA-s9ft-gn8c-nz8s",
            "PKSA-x6tz-s6v3-ynk3",
            "PKSA-7qg6-pyzm-bc35",
            "PKSA-y2dn-63zz-mp8n",
            "PKSA-24rt-ffr7-cj1w",
            "PKSA-spqx-5bk6-c9yk",
            "PKSA-gr7c-c3q7-zxkd",
            "PKSA-8tf6-2hv5-c6tq",
            "PKSA-jndv-7cgy-xwm3",
            "PKSA-vcdc-4796-kn58",
            "PKSA-2t2m-vnwy-55q7",
            "PKSA-nksq-cxj8-zb32"
          ]' \
          '.config.policy.advisories["ignore-id"] = $ids' \
          composer.json > composer-ci.json
      - uses: php-actions/composer@v6
        env:
          COMPOSER: composer-ci.json
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /app
        with:
          command: update --with silverstripe/framework:^${{ matrix.silverstripe-version }} --with phpunit/phpunit:^${{ matrix.phpunit-version }}
          php_version: ${{ matrix.php-version }}
          php_extensions: intl
      - run: |
          ./vendor/bin/phpunit -c phpunit.xml.dist \
          --coverage-clover ./coverage.xml
