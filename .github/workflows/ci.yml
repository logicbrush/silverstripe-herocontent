name: "Continuous Integration"

on: 
  push:

jobs:

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.1'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.2'
          - operating-system: 'ubuntu-latest'
            silverstripe-version: '5.0'
            php-version: '8.3'
  
    name: SS ${{ matrix.silverstripe-version }}, PHP ${{ matrix.php-version }}
    runs-on: ${{ matrix.operating-system }}
    steps:
      - uses: actions/checkout@v3
      - name: Configure CI advisory ignores
        run: |
          jq --slurpfile ids .github/composer-advisory-ignores.json \
          '.config.policy.advisories["ignore-id"] = $ids[0]' \
          composer.json > composer-ci.json
      - uses: php-actions/composer@v6
        env:
          COMPOSER: composer-ci.json
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /app
        with:
          command: update --with silverstripe/framework:^${{ matrix.silverstripe-version }}
          php_version: ${{ matrix.php-version }}
          php_extensions: intl
      - run: |
          ./vendor/bin/phpunit -c phpunit.xml.dist \
          --coverage-clover ./coverage.xml
